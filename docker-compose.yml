# ==============================================================================
# 🐳 DOCKER COMPOSE: Base de Datos PostgreSQL en local
# ------------------------------------------------------------------------------
# Para encender la base de datos:  docker compose up -d
# Para apagar la base de datos:    docker compose down
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: aprendizaje_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aprendizaje_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
